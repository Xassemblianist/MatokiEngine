<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATOKI</title>
  <link rel="modulepreload" href="./caps.js">
  <link rel="modulepreload" href="./jit.js">
  <link rel="modulepreload" href="./threads.js">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }
    #screen {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    #panic-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 0, 0, 0.92);
      color: #ff4444;
      padding: 32px;
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      z-index: 100;
    }
  </style>
</head>
<body>
  <canvas id="screen" width="640" height="360"></canvas>
  <div id="panic-overlay"></div>
  <script type="module" src="./platform.js"></script>
</body>
</html>
