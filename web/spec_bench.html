<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>MATOKI F0_B (H1) — Arketip Başına JIT ECS Özelleştirme Benchmark</title>
  <style>
    body {
      background: #121418;
      color: #e2e8f0;
      font-family: monospace;
      padding: 24px;
      line-height: 1.5;
    }
    h1 {
      margin-top: 0;
      color: #f8fafc;
    }
    #status {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 6px;
      background: #1e242d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1020px;
      gap: 12px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select, button {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
    }
    select {
      background: #242b35;
      border: 1px solid #3b4656;
    }
    button:hover { background: #1d4ed8; }
    .ok { color: #4ade80; }
    .fail { color: #f87171; }
    #meta-bar {
      margin-bottom: 14px;
      color: #94a3b8;
      font-size: 14px;
    }
    table {
      width: 100%;
      max-width: 1052px;
      border-collapse: collapse;
      margin-bottom: 20px;
      background: #1a1f26;
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #2d3748;
    }
    th {
      background: #242b35;
      color: #94a3b8;
      font-weight: bold;
    }
    td.num, th.num {
      text-align: right;
    }
    .badge-pass {
      color: #4ade80;
      font-weight: bold;
    }
    .badge-analyze {
      color: #fbbf24;
    }
    pre {
      background: #1a1f26;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      max-width: 1020px;
    }
  </style>
</head>
<body>
  <h1>MATOKI F0_B (H1) — Çalışma Anı Özelleştirme: Arketip Başına JIT ECS Döngüsü</h1>
  <div id="status">
    <span id="status-text">Benchmark hazırlanıyor...</span>
    <div class="controls">
      <label for="entity-select">Varlık:</label>
      <select id="entity-select">
        <option value="25000">25.000</option>
        <option value="50000">50.000</option>
        <option value="100000" selected>100.000</option>
      </select>
      <button id="rerun-btn" type="button">Yeniden Ölç</button>
    </div>
  </div>
  <div id="meta-bar"></div>
  <table id="bench-table">
    <thead>
      <tr>
        <th>karşılaştırma</th>
        <th class="num">genel (med / min)</th>
        <th class="num">özelleştirilmiş JIT (med / min)</th>
        <th class="num">hızlanma</th>
        <th>H1 durumu</th>
      </tr>
    </thead>
    <tbody id="bench-tbody"></tbody>
  </table>
  <pre id="output"></pre>
  <script type="module" src="./spec_bench.js"></script>
</body>
</html>
