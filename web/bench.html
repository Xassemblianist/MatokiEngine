<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>MATOKI M5_3 — Elle WAT vs Clang (-O2 -msimd128) Benchmark</title>
  <style>
    body {
      background: #121418;
      color: #e2e8f0;
      font-family: monospace;
      padding: 24px;
      line-height: 1.5;
    }
    h1 {
      margin-top: 0;
      color: #f8fafc;
    }
    #status {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 6px;
      background: #1e242d;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ok { color: #4ade80; }
    .fail { color: #f87171; }
    button {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    table {
      width: 100%;
      max-width: 960px;
      border-collapse: collapse;
      margin-bottom: 20px;
      background: #1a1f26;
      border-radius: 6px;
      overflow: hidden;
    }
    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #2d3748;
    }
    th {
      background: #242b35;
      color: #94a3b8;
      font-weight: bold;
    }
    td.num, th.num {
      text-align: right;
    }
    .badge-enter {
      color: #4ade80;
      font-weight: bold;
    }
    .badge-reject {
      color: #fbbf24;
    }
    pre {
      background: #1a1f26;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      max-width: 960px;
    }
  </style>
</head>
<body>
  <h1>MATOKI M5_3 — Elle WAT vs Clang (-O2 -msimd128)</h1>
  <div id="status">
    <span id="status-text">Benchmark çalışıyor (ısınma + 15 tekrar)...</span>
    <button id="rerun-btn" type="button">Yeniden Ölç</button>
  </div>
  <table id="bench-table">
    <thead>
      <tr>
        <th>çekirdek</th>
        <th class="num">C (clang)</th>
        <th class="num">WAT (elle)</th>
        <th class="num">oran</th>
        <th>karar</th>
      </tr>
    </thead>
    <tbody id="bench-tbody"></tbody>
  </table>
  <pre id="output"></pre>
  <script type="module" src="./bench.js"></script>
</body>
</html>
