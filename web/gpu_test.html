<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATOKI — WebGPU RHI Demosu (M15_B)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #0b0d14;
      color: #dce6f7;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }
    #hud {
      position: fixed;
      top: 10px;
      left: 12px;
      background: rgba(16, 20, 32, 0.88);
      border: 1px solid #3c4d6e;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.45;
      z-index: 10;
      pointer-events: none;
    }
    #gpu-screen {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    #panic-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 0, 0, 0.92);
      color: #ff5555;
      padding: 32px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="hud">MATOKI WebGPU RHI (M15_B) — Yükleniyor...</div>
  <canvas id="gpu-screen" width="640" height="360"></canvas>
  <div id="panic-overlay"></div>

  <script type="module">
    import { createJitLoader } from "./jit.js";
    import { initGpu } from "./gpu.js";

    const decoder = new TextDecoder("utf-8");
    const canvas = document.getElementById("gpu-screen");
    const hud = document.getElementById("hud");
    const panicOverlay = document.getElementById("panic-overlay");

    let memory = null;
    let table = null;
    let running = true;

    function readCString(ptr, maxLen = 256) {
      const u8 = new Uint8Array(memory.buffer, ptr);
      let len = 0;
      while (len < maxLen && u8[len] !== 0) len++;
      const bytes = new Uint8Array(memory.buffer, ptr, len);
      if (typeof SharedArrayBuffer !== "undefined" && memory.buffer instanceof SharedArrayBuffer) {
        return decoder.decode(bytes.slice());
      }
      return decoder.decode(bytes);
    }

    function showPanic(msg) {
      running = false;
      console.error(`[MATOKI GPU PANIC] ${msg}`);
      panicOverlay.textContent = `MATOKI GPU PANIC\n\n${msg}`;
      panicOverlay.style.display = "block";
    }

    function createTableForModule(mod) {
      const imports = WebAssembly.Module.imports(mod);
      let initial = 64;
      for (const imp of imports) {
        if (imp.module === "env" && imp.name === "__indirect_function_table" && imp.kind === "table") {
          if (imp.type && typeof imp.type.minimum === "number") {
            initial = Math.max(initial, imp.type.minimum);
          } else if (imp.type && typeof imp.type.initial === "number") {
            initial = Math.max(initial, imp.type.initial);
          }
        }
      }
      return new WebAssembly.Table({ element: "anyfunc", initial });
    }

    async function main() {
      const resp = await fetch("./engine.wasm", { cache: "no-store" });
      const bytes = await resp.arrayBuffer();
      const mod = await WebAssembly.compile(bytes);
      table = createTableForModule(mod);

      let instance = null;
      for (const tryShared of [true, false]) {
        try {
          memory = new WebAssembly.Memory({ initial: 4096, maximum: 16384, shared: tryShared });
          const env = {
            memory,
            __indirect_function_table: table,
            plat_log(ptr, len) {
              console.log(readCString(ptr, len));
            },
            plat_panic(ptr, len) {
              showPanic(readCString(ptr, len));
            },
            plat_time_ms() {
              return performance.now();
            },
            plat_jit_load: createJitLoader(memory, table),
            plat_download() {},
          };
          instance = new WebAssembly.Instance(mod, { env });
          break;
        } catch (err) {
          if (!tryShared) throw err;
        }
      }

      const exports = instance.exports;
      const gpu = await initGpu(canvas, exports, memory);

      function readSummary() {
        if (!exports.engine_gpu_test_summary) return null;
        const ptr = exports.engine_gpu_test_summary() >>> 0;
        if (!ptr) return null;
        const dv = new DataView(memory.buffer, ptr, 48);
        return {
          width: dv.getUint32(0, true),
          height: dv.getUint32(4, true),
          bgPixels: dv.getUint32(8, true),
          triPixels: dv.getUint32(12, true),
          triRedPixels: dv.getUint32(16, true),
          triGreenPixels: dv.getUint32(20, true),
          triBluePixels: dv.getUint32(24, true),
          cubePixels: dv.getUint32(28, true),
          cubeWarmPixels: dv.getUint32(32, true),
          cubeCoolPixels: dv.getUint32(36, true),
          gpuErrors: dv.getUint32(40, true),
          passed: dv.getUint32(44, true) !== 0,
        };
      }

      async function verify() {
        if (!gpu) return null;
        await gpu.readbackPixels();
        const s = readSummary();
        globalThis.matokiGpu.summary = s;
        return s;
      }

      async function runCompare() {
        if (!gpu) return { error: "WebGPU desteklenmiyor" };
        if (typeof exports.engine_gpu_compare_count !== "function") {
          return { error: "engine_gpu_compare export bulunamadı" };
        }
        const count = exports.engine_gpu_compare_count() >>> 0;
        const results = [];
        gpu.resize(128, 128);

        if (typeof exports.engine_gpu_compare_init_gpu === "function") {
          const initBytes = exports.engine_gpu_compare_init_gpu() >>> 0;
          if (initBytes > 0) {
            gpu.executeFrame();
          }
        }

        for (let i = 0; i < count; i++) {
          try {
            const isComp = exports.engine_gpu_compare_is_compute(i) !== 0;
            const namePtr = exports.engine_gpu_compare_name(i) >>> 0;
            const name = readCString(namePtr, 64);

            // 1. CPU JIT yürüt
            const cpuOk = exports.engine_gpu_compare_run_cpu(i);
            if (!cpuOk) {
              results.push({ index: i, name, isCompute: isComp, passed: false, error: "CPU JIT başarısız" });
              continue;
            }

            // 2. GPU komut akışı yay
            const emitBytes = exports.engine_gpu_compare_emit_gpu(i);
            if (emitBytes === 0) {
              results.push({ index: i, name, isCompute: isComp, passed: false, error: "GPU emit başarısız" });
              continue;
            }

            // 3. GPU yürüt
            gpu.executeFrame();

            // 4. Readback
            const readbackPtr = exports.engine_gpu_compare_readback_ptr() >>> 0;
            if (!isComp) {
              const pixels = await gpu.readbackPixels();
              if (!pixels || pixels.length < 128 * 128 * 4) {
                results.push({ index: i, name, isCompute: isComp, passed: false, error: "readbackPixels başarısız" });
                continue;
              }
              new Uint8Array(memory.buffer, readbackPtr, 128 * 128 * 4).set(pixels.subarray(0, 128 * 128 * 4));
            } else {
              const resPtr = exports.engine_gpu_compare_result(i) >>> 0;
              const dvTemp = new DataView(memory.buffer, resPtr, 80);
              const bufHandle = dvTemp.getUint32(72, true);
              const bufBytes = dvTemp.getUint32(76, true);
              const bufData = await gpu.readbackBufferData(bufHandle, bufBytes);
              new Uint8Array(memory.buffer, readbackPtr, bufBytes).set(bufData);
            }

            // 5. Verify & Fark haritası üret
            exports.engine_gpu_compare_verify(i);

            // 6. Sonuçları al
            const resPtr = exports.engine_gpu_compare_result(i) >>> 0;
            const dv = new DataView(memory.buffer, resPtr, 80);
            const is_compute = dv.getUint32(36, true) !== 0;
            const width = dv.getUint32(40, true);
            const height = dv.getUint32(44, true);
            const total_count = dv.getUint32(48, true);
            const max_diff = dv.getFloat32(52, true);
            const avg_diff = dv.getFloat32(56, true);
            const exceeded_count = dv.getUint32(60, true);
            const tolerance = dv.getFloat32(64, true);
            const passed = dv.getUint32(68, true) !== 0;

            // Fark haritası (128x128 RGBA8 = 65536 byte)
            const diffMapPtr = exports.engine_gpu_compare_diff_map_ptr() >>> 0;
            const diffMap = Array.from(new Uint8Array(memory.buffer, diffMapPtr, 128 * 128 * 4));

            results.push({
              index: i,
              name,
              isCompute: is_compute,
              width,
              height,
              elementCount: total_count,
              maxDiff: max_diff,
              avgDiff: avg_diff,
              exceededCount: exceeded_count,
              tolerance,
              passed,
              diffMap,
            });
          } catch (err) {
            console.error(`runCompare hatası (çekirdek ${i}):`, err);
            results.push({ index: i, name: `kernel_${i}`, isCompute: false, passed: false, error: String(err) });
          }
        }

        return { count, results, allPassed: results.every(r => r.passed) };
      }

      globalThis.matokiGpu = { exports, memory, gpu, summary: null, readSummary, verify, runCompare };

      const isCompareMode = new URLSearchParams(window.location.search).has("compare");
      if (isCompareMode) {
        hud.textContent = "MATOKI WebGPU RHI | CPU ↔ GPU Karşılaştırma Modu Hazır.";
        return;
      }

      if (!gpu) {
        const avail = exports.engine_gpu_available ? exports.engine_gpu_available() : 0;
        const f1Bytes = exports.engine_gpu_test_frame(0, 0.016);
        hud.textContent =
          `WebGPU cihazı yok (engine_gpu_available=${avail}) — CPU yedek yolu.\n` +
          `Komut akışı yine üretildi: 1. kare ${f1Bytes} bayt`;
        return;
      }

      let lastTime = performance.now();
      let fpsFrames = 0;
      let fpsLast = lastTime;
      let fpsVal = 0;

      function frame(now) {
        if (!running) return;
        const dt = Math.min((now - lastTime) * 0.001, 0.1);
        lastTime = now;

        const streamBytes = exports.engine_gpu_test_frame(now, dt);
        const cmdCount = gpu.executeFrame();
        const s = readSummary();
        globalThis.matokiGpu.summary = s;

        fpsFrames++;
        if (now - fpsLast >= 500) {
          fpsVal = (fpsFrames * 1000) / (now - fpsLast);
          fpsFrames = 0;
          fpsLast = now;
        }

        const verifyTxt = s && s.bgPixels > 0
          ? ` | piksel=${s.passed ? "OK" : "HATA"} (üçgen=${s.triPixels}, küp=${s.cubePixels}, hata=${s.gpuErrors})`
          : "";

        hud.textContent =
          `MATOKI WebGPU RHI (M15_C) | format=${gpu.format} | ` +
          `FPS=${fpsVal.toFixed(1)} | akış=${streamBytes} B (${cmdCount} komut) | ` +
          `kaynaklar=${gpu.resources.size}${verifyTxt}`;

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    }

    main().catch((err) => showPanic(err.message || String(err)));
  </script>
</body>
</html>
